{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "Bild" -}}
{{- $id := .Get "id" | default "iwip_blog_image_overlay" -}}

{{- if $src -}}
<figure class="figure-frame figure-frame--zoomable">
  <button
    type="button"
    class="iwip_blog_image_trigger"
    data-iwip-overlay-target="{{ $id }}"
    aria-controls="{{ $id }}"
    aria-expanded="false"
    aria-label="Bild vergrößern: {{ $alt }}"
    title="Bild vergrößern">
    <img src="{{ $src }}"
         alt="{{ $alt }}">
  </button>
</figure>

<div
  id="{{ $id }}"
  class="iwip_overlay iwip_overlay--image"
  data-iwip-overlay
  role="dialog"
  aria-modal="true"
  aria-label="Vergrößerte Bildansicht"
  hidden>
  <div class="iwip_overlay_panel">
    <button
      type="button"
      class="iwip_overlay_close"
      data-iwip-overlay-close
      aria-label="Overlay schließen">×</button>

    <div class="iwip_blog_image_wrap">
      <img src="{{ $src }}"
           alt="{{ $alt }}"
           loading="lazy">
    </div>
  </div>
</div>
{{- end -}}
