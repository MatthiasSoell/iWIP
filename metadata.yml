  description: In dieser Sitzung ziehen Studierende der Wirtschaftspädagogik ein Zwischenfazit zu den bisherigen Themen des Moduls Bildungssysteme. Der Beitrag bündelt Bildungswege, Systemaufbau, duale Ausbildung, Hochschulbildung und Weiterbildung auf die Frage hin, wie sich das Verhältnis von Bildung und Arbeit verändert. Zugleich bereitet er den Übergang zu Digitalisierung, New Work und gesellschaftlichem Wandel vor.
