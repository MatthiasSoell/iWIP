  name: 'SciBlog iWIP und didaktischer Agent: Orientierung statt Tool Zoo'
  description: Der Beitrag zeigt Lehrenden, Hochschuldidaktiker:innen und Bildungswissenschaftler:innen, wie SciBlog iWIP und das dazugehörige didaktisch spezialisierte, dialogische und reflexive Agentensystem als zusammenhängende Infrastruktur für Lehre, Präsentationen und OER gedacht sind. Ausgehend von Erfahrungen mit einem wachsenden "Tool Zoo" in der Lehre erläutert er die Funktionen des Blogs, den Mehrwert eines blog-first-Workflows und die Rolle eines spezialisierten Agenten für didaktisch konsistente OER.
