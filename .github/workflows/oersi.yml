name: Generate OERSI metadata

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Generate metadata.yml
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          BASE_URL = 'https://matthiassoell.github.io/iWIP'
          UNIVERSITY_OF_ROSTOCK = {
            'name' => 'Universitaet Rostock',
            'id' => 'https://ror.org/03zdwsf69',
            'url' => 'https://www.uni-rostock.de/',
            'type' => 'Organization'
          }.freeze
          SOURCE_ORGANIZATION = [UNIVERSITY_OF_ROSTOCK].freeze

          ORGANIZATION_MAP = {
            'universitaet rostock · institut fuer wirtschaftspaedagogik' => {
              'name' => 'Universitaet Rostock · Institut fuer Wirtschaftspaedagogik',
              'id' => 'https://ror.org/03zdwsf69',
              'url' => 'https://www.uni-rostock.de/',
              'type' => 'Organization'
            },
            'universitaet potsdam' => {
              'name' => 'Universitaet Potsdam',
              'id' => 'https://ror.org/03bnmw459',
              'url' => 'https://www.uni-potsdam.de/en/',
              'type' => 'Organization'
            }
          }.freeze

          LEARNING_RESOURCE_TYPE_MAP = {
            'article' => {
              'id' => 'https://w3id.org/kim/hcrt/text',
              'name' => 'Text'
            },
            # HCRT has no exact concept for a lesson/unit page; keep the editorial value
            # in frontmatter and export the conservative controlled fallback.
            'lesson' => {
              'id' => 'https://w3id.org/kim/hcrt/text',
              'name' => 'Text'
            },
            'lesson plan' => {
              'id' => 'https://w3id.org/kim/hcrt/lesson_plan',
              'name' => 'Lesson Plan'
            },
            # Workshop documentation is not an HCRT concept; use the generic text type.
            'workshop documentation' => {
              'id' => 'https://w3id.org/kim/hcrt/text',
              'name' => 'Text'
            },
            'worksheet' => {
              'id' => 'https://w3id.org/kim/hcrt/worksheet',
              'name' => 'Worksheet'
            }
          }.freeze

          EDUCATIONAL_LEVEL_MAP = {
            'bachelor (grundlagenorientiert)' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_6',
              'name' => 'Bachelor oder aequivalent'
            },
            'berufliche bildung' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_4',
              'name' => 'Postsekundarer nicht-tertiaerer Bereich'
            },
            'fortbildung' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_C',
              'name' => 'Fortbildung'
            },
            'hochschule' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_A',
              'name' => 'Hochschule'
            },
            'lehrerfortbildung' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_C',
              'name' => 'Fortbildung'
            },
            'lehrkraeftefortbildung' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_C',
              'name' => 'Fortbildung'
            },
            # The KIM vocabulary has no narrower concept for gymnasiale Oberstufe.
            'oberstufe' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_3',
              'name' => 'Sekundarbereich II'
            },
            'sekundarstufe i' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_2',
              'name' => 'Sekundarbereich I'
            },
            'sekundarstufe ii' => {
              'id' => 'https://w3id.org/kim/educationalLevel/level_3',
              'name' => 'Sekundarbereich II'
            }
          }.freeze

          ABOUT_CONCEPTS = {
            'berufs_und_wirtschaftspaedagogik' => {
              'id' => 'https://w3id.org/kim/hochschulfaechersystematik/n270',
              'name' => 'Berufs- und Wirtschaftspaedagogik'
            },
            'erziehungswissenschaften' => {
              'id' => 'https://w3id.org/kim/hochschulfaechersystematik/n33',
              'name' => 'Erziehungswissenschaften'
            },
            'wirtschaftspaedagogik' => {
              'id' => 'https://w3id.org/kim/hochschulfaechersystematik/n181',
              'name' => 'Wirtschaftspaedagogik'
            }
          }.freeze

          ABOUT_TERM_MAP = {
            'berufliche bildung' => ['berufs_und_wirtschaftspaedagogik'],
            'berufsorientierung' => ['berufs_und_wirtschaftspaedagogik'],
            'bildungssysteme' => ['berufs_und_wirtschaftspaedagogik'],
            'didaktik' => ['erziehungswissenschaften'],
            'hochschuldidaktik' => ['erziehungswissenschaften'],
            'oer' => ['erziehungswissenschaften'],
            'open educational resources' => ['erziehungswissenschaften'],
            'wirtschaftsdidaktik' => ['berufs_und_wirtschaftspaedagogik'],
            'wirtschaftspaedagogik' => ['wirtschaftspaedagogik', 'berufs_und_wirtschaftspaedagogik']
          }.freeze
          DEFAULT_ABOUT_KEYS = ['berufs_und_wirtschaftspaedagogik'].freeze

          def present?(value)
            !(value.nil? || (value.respond_to?(:empty?) && value.empty?))
          end

          def normalize_scalar(value)
            return value.iso8601 if value.respond_to?(:iso8601)
            value
          end

          def normalize_text(value)
            value.to_s.gsub(/\s+/, ' ').strip
          end

          def normalize_key(value)
            text = normalize_text(value).downcase
            text.tr('äöüß', 'aouss').gsub('ae', 'ae').gsub('oe', 'oe').gsub('ue', 'ue')
          end

          def build_defined_term(id, name)
            {
              'id' => id,
              'name' => name
            }
          end

          def map_license(license)
            return nil unless license.is_a?(Hash)

            license_id = license['url']
            return nil unless present?(license_id)

            mapped = { 'id' => license_id }
            mapped['name'] = normalize_text(license['label']) if present?(license['label'])
            mapped['url'] = license_id
            mapped
          end

          def map_organization(value)
            return nil unless present?(value)

            ORGANIZATION_MAP[normalize_key(value)] || {
              'name' => normalize_text(value),
              'type' => 'Organization'
            }
          end

          def map_learning_resource_type(value)
            mapped = LEARNING_RESOURCE_TYPE_MAP[normalize_key(value)]
            return nil unless mapped

            build_defined_term(mapped['id'], mapped['name'])
          end

          def map_educational_level(value)
            mapped = EDUCATIONAL_LEVEL_MAP[normalize_key(value)]
            return nil unless mapped

            build_defined_term(mapped['id'], mapped['name'])
          end

          def deduplicate_terms(terms)
            terms.compact.uniq { |term| term['id'] }
          end

          def map_about_terms(front, oer)
            matched_keys = []

            Array(front['tags']).each do |tag|
              mapped_keys = ABOUT_TERM_MAP[normalize_key(tag)]
              matched_keys.concat(mapped_keys) if mapped_keys
            end

            Array(oer['about']).each do |item|
              term = item.is_a?(Hash) ? item['term'] : item
              mapped_keys = ABOUT_TERM_MAP[normalize_key(term)]
              matched_keys.concat(mapped_keys) if mapped_keys
            end

            matched_keys = DEFAULT_ABOUT_KEYS if matched_keys.empty?
            deduplicate_terms(matched_keys.map { |key| ABOUT_CONCEPTS[key] })
          end

          entries = Dir.glob('content/blog/**/index.md').sort.map do |path|
            content = File.read(path)
            next unless content.start_with?("---\n")

            parts = content.split(/^---\s*$\n?/, 3)
            next if parts.length < 3

            front = YAML.safe_load(parts[1], permitted_classes: [Date, Time], aliases: true) || {}
            next unless front['draft'] == false

            oer = front['oer'] || {}
            next unless oer['is_oer'] == true

            permalink = front['permalink']
            next unless present?(permalink)

            url = "#{BASE_URL}#{permalink}"

            keywords = []
            Array(front['tags']).each do |tag|
              normalized = normalize_text(tag)
              keywords << normalized if present?(normalized) && !keywords.include?(normalized)
            end
            Array(oer['about']).each do |item|
              term = item.is_a?(Hash) ? item['term'] : item
              normalized = normalize_text(term)
              keywords << normalized if present?(normalized) && !keywords.include?(normalized)
            end

            creators = Array(oer['creators']).map do |creator|
              next unless creator.is_a?(Hash)

              mapped = {}
              mapped['name'] = normalize_text(creator['name']) if present?(creator['name'])
              mapped['givenName'] = normalize_text(creator['given_name']) if present?(creator['given_name'])
              mapped['familyName'] = normalize_text(creator['family_name']) if present?(creator['family_name'])
              affiliation = map_organization(creator['affiliation'])
              mapped['affiliation'] = affiliation if affiliation
              mapped['url'] = creator['url'] if present?(creator['url'])
              mapped['identifier'] = creator['orcid'] if present?(creator['orcid'])
              mapped.empty? ? nil : mapped
            end.compact

            item = {}
            item['id'] = url
            item['url'] = url
            item['name'] = normalize_text(front['title']) if present?(front['title'])
            item['creativeWorkStatus'] = 'Published'

            description = front['description'] || front['summary']
            item['description'] = normalize_text(description) if present?(description)
            item['datePublished'] = normalize_scalar(front['date']) if present?(front['date'])
            item['dateModified'] = normalize_scalar(front['lastmod']) if present?(front['lastmod'])
            item['creator'] = creators if creators.any?
            item['publisher'] = {
              'name' => 'SciBlog iWIP',
              'url' => 'https://matthiassoell.github.io/iWIP/'
            }
            item['sourceOrganization'] = SOURCE_ORGANIZATION

            mapped_license = map_license(oer['license'] || {})
            item['license'] = mapped_license if mapped_license

            item['keywords'] = keywords if keywords.any?
            learning_resource_type = map_learning_resource_type(oer['learning_resource_type'])
            item['learningResourceType'] = learning_resource_type if learning_resource_type

            educational_level = deduplicate_terms(Array(oer['educational_level']).map { |value| map_educational_level(value) })
            item['educationalLevel'] = educational_level if educational_level.any?

            about = map_about_terms(front, oer)
            item['about'] = about if about.any?

            item['timeRequired'] = normalize_text(oer['time_required']) if present?(oer['time_required'])
            item['inLanguage'] = normalize_text(oer['in_language']) if present?(oer['in_language'])
            item
          end.compact

          File.write('metadata.yml', YAML.dump(entries, line_width: -1))
          RUBY

      - name: Validate YAML structure and duplicates
        run: |
          ruby <<'RUBY'
          require 'yaml'

          metadata = YAML.load_file('metadata.yml')
          raise 'metadata.yml must contain a top-level array' unless metadata.is_a?(Array)

          ids = metadata.map { |entry| entry['id'] }
          duplicate_ids = ids.group_by(&:itself).select { |_id, group| group.size > 1 }.keys
          raise "Duplicate resource ids: #{duplicate_ids.join(', ')}" unless duplicate_ids.empty?

          metadata.each do |entry|
            raise 'Missing id' unless entry['id']
            raise "Missing name for #{entry['id']}" unless entry['name']
            raise "Missing url for #{entry['id']}" unless entry['url']
            raise "Missing creativeWorkStatus for #{entry['id']}" unless entry['creativeWorkStatus'] == 'Published'
            raise "Missing license.id for #{entry['id']}" unless entry.dig('license', 'id')
            raise "sourceOrganization must not be a string for #{entry['id']}" if entry['sourceOrganization'].is_a?(String)
            raise "sourceOrganization must be an array for #{entry['id']}" unless entry['sourceOrganization'].is_a?(Array)
            raise "audience must not be exported for #{entry['id']}" if entry.key?('audience')

            entry['sourceOrganization'].each do |organization|
              raise "sourceOrganization entries must be objects for #{entry['id']}" unless organization.is_a?(Hash)
              raise "sourceOrganization.name missing for #{entry['id']}" unless organization['name']
              raise "sourceOrganization.type missing for #{entry['id']}" unless organization['type'] == 'Organization'
            end

            Array(entry['creator']).each do |creator|
              raise "creator.affiliation must be an object for #{entry['id']}" if creator['affiliation'].is_a?(String)
              next unless creator['affiliation'].is_a?(Hash)

              raise "creator.affiliation.name missing for #{entry['id']}" unless creator.dig('affiliation', 'name')
              raise "creator.affiliation.type missing for #{entry['id']}" unless creator.dig('affiliation', 'type') == 'Organization'
            end
          end
          RUBY

      - name: Validate exported URLs
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'net/http'
          require 'uri'

          def fetch_response(uri, limit = 5)
            raise 'Too many redirects' if limit <= 0

            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = uri.scheme == 'https'
            http.open_timeout = 20
            http.read_timeout = 20

            path = uri.path.empty? ? '/' : uri.path
            path += "?#{uri.query}" if uri.query
            headers = { 'User-Agent' => 'SciBlog-iWIP-OERSI-Workflow' }

            response = http.request(Net::HTTP::Head.new(path, headers))
            response = http.request(Net::HTTP::Get.new(path, headers)) if response.code.to_i >= 400

            if response.is_a?(Net::HTTPRedirection)
              location = response['location']
              raise "Redirect without location for #{uri}" unless location
              return fetch_response(URI.join(uri.to_s, location), limit - 1)
            end

            response
          end

            metadata = YAML.safe_load(
              File.read('metadata.yml'),
              permitted_classes: [Date, Time],
              aliases: true
            )
            urls = []

            metadata.each do |entry|
              if ENV['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                # Vollpruefung (inkl. eigener Seiten)
                urls << entry['id']
                urls << entry['url']
              end

              # Immer pruefen (stabile externe URLs)
              urls << entry.dig('publisher', 'url')
              Array(entry['sourceOrganization']).each do |organization|
                urls << organization['id'] if organization['id']
                urls << organization['url'] if organization['url']
              end
              urls << entry.dig('license', 'url')
              urls << entry.dig('license', 'id')

              Array(entry['about']).each do |term|
                urls << term['id']
              end

              Array(entry['educationalLevel']).each do |term|
                urls << term['id']
              end

              if entry['learningResourceType'].is_a?(Hash)
                urls << entry['learningResourceType']['id']
              end

              Array(entry['creator']).each do |creator|
                urls << creator.dig('affiliation', 'id')
                urls << creator.dig('affiliation', 'url')
                urls << creator['url']
                urls << creator['identifier']
              end
            end

            urls = urls.compact.uniq

          failures = []
          urls.each do |url|
            response = fetch_response(URI(url))
            code = response.code.to_i
            failures << "#{url} => #{code}" unless code.between?(200, 399)
          rescue StandardError => error
            failures << "#{url} => #{error.class}: #{error.message}"
          end

          raise failures.join("\n") unless failures.empty?
          RUBY

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: oersi-metadata
          path: metadata.yml

      - name: Check metadata changes
        id: metadata_changes
        run: |
          if git diff --quiet -- metadata.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metadata_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated metadata.yml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metadata_changes.outputs.changed == 'true'
        run: |
          git add metadata.yml
          git commit -m "chore: update oersi metadata"

      - name: Push updated metadata.yml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metadata_changes.outputs.changed == 'true'
        run: git push