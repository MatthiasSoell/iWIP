name: Generate OERSI metadata

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Generate metadata.yml
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          BASE_URL = 'https://matthiassoell.github.io/iWIP'

          def present?(value)
            !(value.nil? || (value.respond_to?(:empty?) && value.empty?))
          end

          def normalize_scalar(value)
            return value.iso8601 if value.respond_to?(:iso8601)
            value
          end

          def normalize_text(value)
            value.to_s.gsub(/\s+/, ' ').strip
          end

          def required!(path, field_name, value)
            return value if present?(value)

            raise "#{path}: missing #{field_name}"
          end

          def required_array!(path, field_name, value)
            raise "#{path}: missing #{field_name}" unless value.is_a?(Array) && value.any?

            value
          end

          def normalize_defined_term(path, field_name, value)
            raise "#{path}: #{field_name} entries must be objects" unless value.is_a?(Hash)

            {
              'id' => required!(path, "#{field_name}.id", normalize_text(value['id'])),
              'name' => required!(path, "#{field_name}.name", normalize_text(value['name']))
            }
          end

          def normalize_organization(path, field_name, value)
            raise "#{path}: #{field_name} must be an object" unless value.is_a?(Hash)

            organization = {
              'name' => required!(path, "#{field_name}.name", normalize_text(value['name'])),
              'type' => required!(path, "#{field_name}.type", normalize_text(value['type']))
            }
            organization['id'] = normalize_text(value['id']) if present?(value['id'])
            organization['url'] = normalize_text(value['url']) if present?(value['url'])
            organization
          end

          def normalize_creator(path, value)
            raise "#{path}: oer.creators entries must be objects" unless value.is_a?(Hash)

            creator = {
              'name' => required!(path, 'oer.creators.name', normalize_text(value['name']))
            }
            creator['type'] = normalize_text(value['type']) if present?(value['type'])
            creator['givenName'] = normalize_text(value['given_name']) if present?(value['given_name'])
            creator['familyName'] = normalize_text(value['family_name']) if present?(value['family_name'])
            creator['affiliation'] = normalize_organization(path, 'oer.creators.affiliation', value['affiliation']) if value.key?('affiliation')
            creator['url'] = normalize_text(value['url']) if present?(value['url'])
            creator['identifier'] = normalize_text(value['orcid'] || value['identifier']) if present?(value['orcid'] || value['identifier'])
            creator
          end

          def normalize_license(path, value)
            raise "#{path}: oer.license must be an object" unless value.is_a?(Hash)

            license_url = required!(path, 'oer.license.url', normalize_text(value['url']))
            license = {
              'id' => license_url,
              'url' => license_url
            }
            license['name'] = normalize_text(value['label']) if present?(value['label'])
            license
          end

          def normalize_terms(path, field_name, values)
            required_array!(path, field_name, values).map do |value|
              normalize_defined_term(path, field_name, value)
            end.uniq { |term| term['id'] }
          end

          entries = Dir.glob('content/blog/**/index.md').sort.map do |path|
            content = File.read(path)
            next unless content.start_with?("---\n")

            parts = content.split(/^---\s*$\n?/, 3)
            next if parts.length < 3

            front = YAML.safe_load(parts[1], permitted_classes: [Date, Time], aliases: true) || {}
            next unless front['draft'] == false

            oer = front['oer'] || {}
            next unless oer['is_oer'] == true

            title = required!(path, 'title', normalize_text(front['title']))
            description = normalize_text(front['description'] || front['summary'])
            required!(path, 'description or summary', description)
            permalink = required!(path, 'permalink', normalize_text(front['permalink']))
            creators = required_array!(path, 'oer.creators', oer['creators']).map { |creator| normalize_creator(path, creator) }
            required!(path, 'oer.image', normalize_text(oer['image']))
            required_array!(path, 'oer.in_language', oer['in_language'])
            required_array!(path, 'oer.learning_resource_type', oer['learning_resource_type'])
            required_array!(path, 'oer.educational_level', oer['educational_level'])
            required_array!(path, 'oer.about', oer['about'])
            license = normalize_license(path, required!(path, 'oer.license', oer['license']))
            required!(path, 'oer.publisher', oer['publisher'])

            url = "#{BASE_URL}#{permalink}"

            item = {
              'id' => url,
              'url' => url,
              'image' => normalize_text(oer['image']),
              'name' => title,
              'description' => description,
              'creativeWorkStatus' => 'Published',
              'creator' => creators,
              'license' => license,
              'learningResourceType' => normalize_terms(path, 'oer.learning_resource_type', oer['learning_resource_type']),
              'educationalLevel' => normalize_terms(path, 'oer.educational_level', oer['educational_level']),
              'about' => normalize_terms(path, 'oer.about', oer['about']),
              'inLanguage' => required_array!(path, 'oer.in_language', oer['in_language']).map { |value| normalize_text(value) }
            }

            item['datePublished'] = normalize_scalar(front['date']) if present?(front['date'])
            item['dateModified'] = normalize_scalar(front['lastmod']) if present?(front['lastmod'])
            item['publisher'] = {
              'name' => required!(path, 'oer.publisher.name', normalize_text(oer['publisher']['name'])),
              'url' => required!(path, 'oer.publisher.url', normalize_text(oer['publisher']['url']))
            }
            keywords = Array(oer['keywords']).map { |value| normalize_text(value) }.reject(&:empty?).uniq
            item['keywords'] = keywords if keywords.any?
            item['timeRequired'] = normalize_text(oer['time_required']) if present?(oer['time_required'])
            item
          end.compact

          File.write('metadata.yml', YAML.dump(entries, line_width: -1))
          RUBY

      - name: Validate YAML structure and duplicates
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'

          metadata = YAML.safe_load(
            File.read('metadata.yml'),
            permitted_classes: [Date, Time],
            aliases: true
          )
          raise 'metadata.yml must contain a top-level array' unless metadata.is_a?(Array)

          ids = metadata.map { |entry| entry['id'] }
          duplicate_ids = ids.group_by(&:itself).select { |_id, group| group.size > 1 }.keys
          raise "Duplicate resource ids: #{duplicate_ids.join(', ')}" unless duplicate_ids.empty?

          metadata.each do |entry|
            raise 'Missing id' unless entry['id']
            raise "Missing name for #{entry['id']}" unless entry['name']
            raise "Missing url for #{entry['id']}" unless entry['url']
            raise "Missing description for #{entry['id']}" unless entry['description']
            raise "Missing image for #{entry['id']}" unless entry['image']
            raise "Missing creativeWorkStatus for #{entry['id']}" unless entry['creativeWorkStatus'] == 'Published'
            raise "Missing license.id for #{entry['id']}" unless entry.dig('license', 'id')
            raise "Missing license.url for #{entry['id']}" unless entry.dig('license', 'url')
            raise "Missing creator for #{entry['id']}" unless entry['creator'].is_a?(Array) && entry['creator'].any?
            raise "learningResourceType must be an array for #{entry['id']}" unless entry['learningResourceType'].is_a?(Array) && entry['learningResourceType'].any?
            raise "educationalLevel must be an array for #{entry['id']}" unless entry['educationalLevel'].is_a?(Array) && entry['educationalLevel'].any?
            raise "about must be an array for #{entry['id']}" unless entry['about'].is_a?(Array) && entry['about'].any?
            raise "inLanguage must be an array for #{entry['id']}" unless entry['inLanguage'].is_a?(Array) && entry['inLanguage'].any?
            raise "audience must not be exported for #{entry['id']}" if entry.key?('audience')

            Array(entry['learningResourceType']).each do |term|
              raise "learningResourceType entries must be objects for #{entry['id']}" unless term.is_a?(Hash)
              raise "learningResourceType.id missing for #{entry['id']}" unless term['id']
              raise "learningResourceType.name missing for #{entry['id']}" unless term['name']
            end

            Array(entry['educationalLevel']).each do |term|
              raise "educationalLevel entries must be objects for #{entry['id']}" unless term.is_a?(Hash)
              raise "educationalLevel.id missing for #{entry['id']}" unless term['id']
              raise "educationalLevel.name missing for #{entry['id']}" unless term['name']
            end

            Array(entry['about']).each do |term|
              raise "about entries must be objects for #{entry['id']}" unless term.is_a?(Hash)
              raise "about.id missing for #{entry['id']}" unless term['id']
              raise "about.name missing for #{entry['id']}" unless term['name']
            end

            Array(entry['creator']).each do |creator|
              raise "creator.affiliation must be an object for #{entry['id']}" if creator['affiliation'].is_a?(String)
              next unless creator['affiliation'].is_a?(Hash)

              raise "creator.affiliation.name missing for #{entry['id']}" unless creator.dig('affiliation', 'name')
              raise "creator.affiliation.type missing for #{entry['id']}" unless creator.dig('affiliation', 'type') == 'Organization'
            end
          end
          RUBY

      - name: Validate exported URLs
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'net/http'
          require 'uri'
          require 'date'

          def fetch_response(uri, limit = 5)
            raise 'Too many redirects' if limit <= 0

            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = uri.scheme == 'https'
            http.open_timeout = 20
            http.read_timeout = 20

            path = uri.path.empty? ? '/' : uri.path
            path += "?#{uri.query}" if uri.query
            headers = { 'User-Agent' => 'SciBlog-iWIP-OERSI-Workflow' }

            response = http.request(Net::HTTP::Head.new(path, headers))
            response = http.request(Net::HTTP::Get.new(path, headers)) if response.code.to_i >= 400

            if response.is_a?(Net::HTTPRedirection)
              location = response['location']
              raise "Redirect without location for #{uri}" unless location
              return fetch_response(URI.join(uri.to_s, location), limit - 1)
            end

            response
          end

            metadata = YAML.safe_load(
              File.read('metadata.yml'),
              permitted_classes: [Date, Time],
              aliases: true
            )
            urls = []

            metadata.each do |entry|
              if ENV['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                # Vollpruefung (inkl. eigener Seiten)
                urls << entry['id']
                urls << entry['url']
              end

              # Immer pruefen (stabile externe URLs)
              urls << entry.dig('publisher', 'url')
              urls << entry['image']
              urls << entry.dig('license', 'url')
              urls << entry.dig('license', 'id')

              Array(entry['about']).each do |term|
                urls << term['id']
              end

              Array(entry['educationalLevel']).each do |term|
                urls << term['id']
              end

              Array(entry['learningResourceType']).each do |term|
                urls << term['id'] if term.is_a?(Hash)
              end

              Array(entry['creator']).each do |creator|
                urls << creator.dig('affiliation', 'id')
                urls << creator.dig('affiliation', 'url')
                urls << creator['url']
                urls << creator['identifier']
              end
            end

            urls = urls.compact.uniq

          failures = []
          urls.each do |url|
            response = fetch_response(URI(url))
            code = response.code.to_i
            failures << "#{url} => #{code}" unless code.between?(200, 399)
          rescue StandardError => error
            failures << "#{url} => #{error.class}: #{error.message}"
          end

          raise failures.join("\n") unless failures.empty?
          RUBY

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: oersi-metadata
          path: metadata.yml

      - name: Check metadata changes
        id: metadata_changes
        run: |
          if git diff --quiet -- metadata.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metadata_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated metadata.yml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metadata_changes.outputs.changed == 'true'
        run: |
          git add metadata.yml
          git commit -m "chore: update oersi metadata"

      - name: Push updated metadata.yml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metadata_changes.outputs.changed == 'true'
        run: git push