name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.7
      REVEAL_URL: http://127.0.0.1:8080/iWIP/praesentation/lehre/bisy/berufswahl_erste_schwelle/#/
      PDF_OUTPUT: public/praesentation/lehre/bisy/berufswahl_erste_schwelle/berufswahl_erste_schwelle.pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
          which hugo
          hugo version

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Download Hugo Modules
        run: hugo mod get

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Export reveal presentation as PDF
        run: |
          python3 -m http.server 8080 --directory public --bind 127.0.0.1 > /tmp/public-server.log 2>&1 &
          server_pid=$!
          
          trap 'kill "$server_pid"' EXIT

          sleep 3

          echo "=== public tree ==="
          find public -maxdepth 6 | sort

          echo "=== target dir candidates ==="
          find public -type f \( -name "index.html" -o -name "*.html" \) | sort | grep berufswahl || true

          curl --fail --silent --show-error --retry 10 --retry-delay 1 "$REVEAL_URL" > /dev/null

          mkdir -p "$(dirname "$PDF_OUTPUT")"

          npx -y decktape \
            --pause 2000 \
            --chrome-arg=--no-sandbox \
            --chrome-arg=--disable-dev-shm-usage \
            reveal \
            "$REVEAL_URL" \
            "$PDF_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
