name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
          which hugo
          hugo version

      - name: Install Dart Sass
        run: npm install -g sass

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Determine Reveal PDF export scope
        id: pdf_scope
        run: |
          changed_paths_file="${RUNNER_TEMP}/reveal_changed_paths.txt"
          : > "$changed_paths_file"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$changed_paths_file"
            echo "force_full_rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "force_full_rebuild=true" >> "$GITHUB_OUTPUT"
          fi

          echo "changed_paths_file=$changed_paths_file" >> "$GITHUB_OUTPUT"

      - name: Export reveal presentations as PDFs
        run: |
          rm -rf served
          mkdir -p served/iWIP
          cp -R public/. served/iWIP/

          python3 -m http.server 8080 --directory served --bind 127.0.0.1 > /tmp/public-server.log 2>&1 &
          server_pid=$!
          
          trap 'kill "$server_pid"' EXIT

          sleep 3

          export_args=(
            --changed-paths-file "${{ steps.pdf_scope.outputs.changed_paths_file }}"
            --published-base-url "${{ steps.pages.outputs.base_url }}"
          )

          if [[ "${{ steps.pdf_scope.outputs.force_full_rebuild }}" == "true" ]]; then
            export_args+=(--force-full-rebuild)
          fi

          python3 scripts/export_reveal_pdfs.py "${export_args[@]}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
